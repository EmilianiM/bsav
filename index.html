<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge vendeurs</title>
<style>
:root{--red:#e30613;--navy:#07172c;--blue:#103c63;--green:#2bdc74;--text:#fff;--muted:#a9bdd2}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#103a63,#07172c 40%,#040c18);background-attachment:fixed;color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
.app{max-width:480px;min-height:100vh;margin:auto;padding:14px 14px 40px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.logo{padding:12px 9px;background:var(--red);font-size:24px;font-weight:900}
.small{color:var(--muted);font-size:12px}
.date{margin-top:3px;color:#7fdfff;font-size:11px}
.region{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0;padding:15px;border:1px solid #13b8e9;border-radius:18px;background:linear-gradient(135deg,#103c63,#071d38)}
.region > div:last-child{text-align:end}
.rank{font-size:30px;font-weight:900}
.up{color:var(--green);font-weight:800}
.down{color:#ff5a6e;font-weight:800}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px;border-radius:24px;background:#091a31}
.tab{padding:12px;border:0;border-radius:20px;background:transparent;color:#fff;font-weight:800;cursor:pointer;font-size:14px}
.tab.active{background:linear-gradient(90deg,#f20b31,#ff3f62)}
.title{margin:20px 0 12px;text-align:center}
.title h2{margin:0 0 4px}
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:8px;margin:25px 0 16px}
.podium-card{min-width:0;padding:12px 6px;border:1px solid #355b82;border-radius:22px;background:linear-gradient(180deg,#163a61,#0b1c35);text-align:center}
.podium-card.first{padding-top:20px;border-color:#ffc43d;box-shadow:0 0 25px #ffc43d55;transform:translateY(-10px)}
.medal{font-size:24px}
.avatar{display:grid;width:64px;height:64px;margin:auto;place-items:center;border:4px solid #b8d8ff;border-radius:50%;background:#173f67;font-size:22px;font-weight:900}
.first .avatar{border-color:#ffc43d;width:72px;height:72px;font-size:26px}
.name{overflow:hidden;margin-top:7px;font-weight:900;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.store{min-height:28px;color:#c6d3df;font-size:11px}
.ca{margin-top:8px;font-size:18px;font-weight:900}
.first .ca{color:#ffd34e;font-size:20px}
.table{overflow:hidden;border:1px solid #244866;border-radius:16px;background:#071a31}
.table:empty{display:none}
.row{display:grid;grid-template-columns:28px 1.25fr 1fr 88px;align-items:center;gap:5px;padding:11px 8px;border-bottom:1px solid #173550;font-size:13px}
.row:last-child{border-bottom:0}
.row.head{color:var(--muted);font-size:10px;font-weight:800}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.money{text-align:right;font-weight:800}
.panel{margin-top:18px;padding:16px;border:1px solid #1f6da1;border-radius:18px;background:#081d36}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats > div{border-right:1px solid #28435e}
.stats > div:last-child{border-right:0}
.stats strong{display:block;font-size:22px}
.progress{height:18px;margin-top:12px;overflow:hidden;border:1px solid #265172;border-radius:20px}
.progress-bar{height:100%;background:linear-gradient(90deg,#2bdc74,#84f68c)}
.empty{padding:25px;color:var(--muted);text-align:center}
.hidden{display:none}
.footer{margin-top:16px;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header class="brand">
    <div class="logo">BUT</div>
    <div>
      <span id="brandText">CUISINES</span>
      <div class="small" id="regionHeader"></div>
      <div class="date" id="updateDate"></div>
    </div>
  </header>

  <section class="region">
    <div>
      <strong id="regionName"></strong>
      <div><span class="rank" id="regionRank"></span> au national</div>
      <div id="regionGrowth"></div>
    </div>
    <div>
      <strong id="regionRevenue"></strong>
      <div class="small">CA Cuisine</div>
    </div>
  </section>

  <div class="tabs">
    <button class="tab active" data-view="sellers">Vendeurs</button>
    <button class="tab" data-view="stores">Magasins</button>
  </div>

  <section id="sellers">
    <div class="title"><h2>Classement vendeurs</h2><div class="small" id="sellerMetric"></div></div>
    <div class="podium" id="sellerPodium"></div>
    <div class="table" id="sellerTable"></div>
  </section>

  <section id="stores" class="hidden">
    <div class="title"><h2>Classement magasins</h2><div class="small">CA TTC Cuisine</div></div>
    <div class="podium" id="storePodium"></div>
    <div class="table" id="storeTable"></div>
  </section>

  <section class="panel">
    <div class="stats">
      <div><strong id="summaryRank"></strong><span class="small">Classement</span></div>
      <div><strong id="summaryRevenue"></strong><span class="small">CA Cuisine</span></div>
      <div><strong id="summaryGrowth"></strong><span class="small">vs N−1</span></div>
    </div>
    <div id="objectiveBlock" style="margin-top:16px">
      <strong>Objectif régional</strong>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      <div class="small" id="objectiveText" style="margin-top:6px"></div>
    </div>
  </section>
  <div class="footer small" id="source"></div>
</div>
<script>
const DATA = {"brand":"CUISINES","title":"JPO","application":{"region":"BOURGOGNE SAVOIE","date":"16/11/2026","rank":12,"revenue":2008000,"growth":9.7,"objective":2008000},"sellerMetric":{"label":"Dont CA TTC Cuisine Buffet","percent":false},"sellers":[{"name":"VINCENT DA COSTA","sub":"CHALON SUR SAONE +1 mag.","value":147062,"avatar":"VC"},{"name":"SANDRINE GAULT","sub":"DIJON","value":146240,"avatar":"SG"},{"name":"PEDRO VIEIRA PEREIRA","sub":"ANNEMASSE","value":139581,"avatar":"PP"},{"name":"ANAIS KURKDJIAN","sub":"CLUSES","value":133605,"avatar":"AK"},{"name":"ADRIEN PHILIBERT","sub":"BOURG-EN-BRESSE","value":127843,"avatar":"AP"},{"name":"EMYN YOUAZ","sub":"LONS LE SAUNIER","value":113379,"avatar":"EY"},{"name":"GRACIELA GUTIERREZ HERRERA","sub":"THONON","value":112987,"avatar":"GH"},{"name":"MEVEN CHAMSON","sub":"DOLE +2 mag.","value":98819,"avatar":"MC"},{"name":"CARLA SCHIRRU","sub":"ANNECY-SILLINGY","value":98453,"avatar":"CS"},{"name":"ELODIE AGNERAY","sub":"ANNECY-SILLINGY","value":96497,"avatar":"EA"},{"name":"JEROME OLEGINE","sub":"DIJON","value":95040,"avatar":"JO"},{"name":"FREDERIC BATAILLE","sub":"PONTARLIER","value":92237,"avatar":"FB"},{"name":"EMILY FERREIRA ROMAO","sub":"THONON","value":91956,"avatar":"ER"},{"name":"MARIE BONNEFOY","sub":"ANNEMASSE","value":83402,"avatar":"MB"},{"name":"BRUNO COQUEBLIN","sub":"CHAUMONT","value":48714,"avatar":"BC"},{"name":"CHLOE CHOCAT","sub":"LANGRES","value":44798,"avatar":"CC"},{"name":"CHLOE PONCET","sub":"ANNECY-SILLINGY","value":44287,"avatar":"CP"},{"name":"CEDRIC HEDE","sub":"CHAUMONT","value":31910,"avatar":"CH"},{"name":"SANJA CABAK","sub":"COSY BEAUNE","value":20504,"avatar":"SC"},{"name":"KATIA ROUXEAU","sub":"CHALON SUR SAONE","value":12845,"avatar":"KR"},{"name":"ANTHONY DESSOL","sub":"THONON","value":12114,"avatar":"AD"},{"name":"THI THUY PHUONG LE","sub":"BOURG-EN-BRESSE","value":9461,"avatar":"TL"},{"name":"JEROME DEREGNAUCOURT","sub":"BESANCON CHATEAUFARINE","value":9264,"avatar":"JD"},{"name":"AMBRE CORDIER","sub":"CLUSES","value":7000,"avatar":"AC"},{"name":"PAULINE ROUSSEAU","sub":"DOLE","value":5777,"avatar":"PR"},{"name":"MAXIME LASSINAT","sub":"THONON","value":4262,"avatar":"ML"},{"name":"JULIAN LEGROS","sub":"CHALON SUR SAONE","value":2060,"avatar":"JL"},{"name":"JULIEN CHAGAS","sub":"CLUSES","value":1474,"avatar":"JC"},{"name":"GUILLAUME GOUGET","sub":"BOURG-EN-BRESSE","value":1035,"avatar":"GG"},{"name":"PIERRE MOREAU","sub":"BESANCON CHATEAUFARINE","value":557,"avatar":"PM"},{"name":"THOMAS SOLY","sub":"DIJON","value":293,"avatar":"TS"},{"name":"KEVIN PONSIN","sub":"THONON","value":267,"avatar":"KP"},{"name":"GEOFFRAY RIMEZ","sub":"ANNECY-SILLINGY","value":59,"avatar":"GR"}],"stores":[{"name":"DIJON","sub":"N° 28 national","growth":12.8,"value":253000,"avatar":"🏬"},{"name":"ANNECY-SILLINGY","sub":"N° 32 national","growth":54.4,"value":249000,"avatar":"🏬"},{"name":"ANNEMASSE","sub":"N° 35 national","growth":58.6,"value":243000,"avatar":"🏬"},{"name":"THONON","sub":"N° 41 national","growth":-24.6,"value":235000,"avatar":"🏬"},{"name":"CHALON SUR SAONE","sub":"N° 90 national","growth":-3.3,"value":170000,"avatar":"🏬"},{"name":"BOURG-EN-BRESSE","sub":"N° 105 national","growth":8.4,"value":155000,"avatar":"🏬"},{"name":"CLUSES","sub":"N° 111 national","growth":521.6,"value":152000,"avatar":"🏬"},{"name":"LONS LE SAUNIER","sub":"N° 142 national","growth":-13.6,"value":129000,"avatar":"🏬"},{"name":"DOLE","sub":"N° 180 national","growth":3.8,"value":105000,"avatar":"🏬"},{"name":"PONTARLIER","sub":"N° 187 national","growth":-11.7,"value":102000,"avatar":"🏬"},{"name":"CHAUMONT","sub":"N° 196 national","growth":17.2,"value":91000,"avatar":"🏬"},{"name":"LANGRES","sub":"N° 262 national","growth":86.6,"value":53000,"avatar":"🏬"},{"name":"BESANCON CHATEAUFARINE","sub":"N° 303 national","growth":-78,"value":30000,"avatar":"🏬"},{"name":"COSY BEAUNE","sub":"N° 309 national","growth":108.2,"value":25000,"avatar":"🏬"},{"name":"COSY GRAY","sub":"N° 325 national","growth":0.8,"value":16000,"avatar":"🏬"}],"source":"STATSA.pptx"};
function challengeRuntime(D) {
  const application = D.application;
  const sellers = D.sellers;
  const stores = D.stores;

  const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const euro = value => Number(value).toLocaleString("fr-FR", {
    style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  const percent = value => Number(value).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " %";
  const sellerValue = v => D.sellerMetric.percent ? percent(v) : euro(v);
  const trend = g => (g == null || g === 0) ? "" :
    `<span class="${g > 0 ? "up" : "down"}">${g > 0 ? "▲" : "▼"} ${percent(Math.abs(g))}</span>`;
  const $ = id => document.getElementById(id);

  document.title = D.title + (application.region ? " – " + application.region : "");
  $("brandText").textContent = D.brand;
  $("regionHeader").textContent = D.title + (application.region ? " · " + application.region : "");
  $("updateDate").textContent = application.date ? "Mise à jour au " + application.date : "";
  $("regionName").textContent = application.region;
  $("regionRank").textContent = application.rank ? "#" + application.rank : "—";
  $("regionGrowth").innerHTML = application.growth ? trend(application.growth) + " vs N−1" : "";
  $("regionRevenue").textContent = euro(application.revenue);
  $("summaryRank").textContent = application.rank ? application.rank + "e" : "—";
  $("summaryRevenue").textContent = euro(application.revenue);
  $("summaryGrowth").innerHTML = trend(application.growth) || "—";
  $("sellerMetric").textContent = D.sellerMetric.label;
  $("source").textContent = D.source ? "Source : " + D.source : "";

  if (application.objective) {
    const achievement = application.revenue / application.objective * 100;
    $("progressBar").style.width = Math.min(achievement, 100) + "%";
    $("objectiveText").textContent = euro(application.revenue) + " / " + euro(application.objective) + " · " + percent(achievement);
  } else {
    $("objectiveBlock").style.display = "none";
  }

  function podium(items, fmt) {
    if (!items.length) return '<div class="empty">Aucune donnée disponible</div>';
    const medals = ["🥇", "🥈", "🥉"];
    const top = items.slice(0, 3);
    const order = top.length === 3 ? [1, 0, 2] : top.map((_, i) => i);
    return order.map(index => {
      const item = top[index];
      return `<div class="podium-card ${index === 0 ? "first" : ""}">
        <div class="medal">${medals[index]}</div>
        <div class="avatar">${esc(item.avatar || "👤")}</div>
        <div class="name" title="${esc(item.name)}">${esc(item.name)}</div>
        <div class="store">${esc(item.sub)}${item.growth != null ? "<br>" + trend(item.growth) : ""}</div>
        <div class="ca">${fmt(item.value)}</div>
      </div>`;
    }).join("");
  }

  function table(items, fmt, colLabel) {
    if (items.length <= 3) return "";
    const rows = items.slice(3).map((item, index) => `<div class="row">
        <strong>${index + 4}</strong>
        <strong class="ellipsis" title="${esc(item.name)}">${esc(item.name)}</strong>
        <span class="small">${esc(item.sub)}${item.growth != null ? " " + trend(item.growth) : ""}</span>
        <span class="money">${fmt(item.value)}</span>
      </div>`).join("");
    return `<div class="row head"><div>#</div><div>NOM</div><div>${colLabel}</div><div style="text-align:right">${D.sellerMetric.percent && colLabel === "MAGASIN" ? "VALEUR" : "CA"}</div></div>${rows}`;
  }

  $("sellerPodium").innerHTML = podium(sellers, sellerValue);
  $("sellerTable").innerHTML = table(sellers, sellerValue, "MAGASIN");
  $("storePodium").innerHTML = podium(stores, euro);
  $("storeTable").innerHTML = table(stores, euro, "RANG NATIONAL");

  document.querySelectorAll(".tab").forEach(button => {
    button.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
      button.classList.add("active");
      $("sellers").classList.toggle("hidden", button.dataset.view !== "sellers");
      $("stores").classList.toggle("hidden", button.dataset.view !== "stores");
    });
  });
}
challengeRuntime(DATA);
</script>
</body>
</html>
